# Reference case. All values are modelling assumptions unless a source is given.

market:
  bidding_zone: SE3              # ENTSO-E code "SE_3"
  backtest_start: "2025-01-01T00:00:00Z"
  backtest_end: "2026-01-01T00:00:00Z"   # exclusive
  resolution_minutes: 60         # v0.1 optimiser runs hourly
  products: [FCR_N, FCR_D_UP, FCR_D_DOWN]
  fcr_price_series: total        # "total" (volume-weighted over both rounds), "fcrAuction1"
                                 # (D-2) or "fcrAuction2" (D-1); see docs/DATA.md
  lookback_days: 14              # history fetched before backtest_start (M2b forecasts)

bess:
  p_max_mw: 10.0
  e_nom_mwh: 20.0
  soc_min: 0.05                  # usable window, fractions of e_nom_mwh
  soc_max: 0.95
  soc_target: 0.50               # daily start/end SOC, fraction of e_nom_mwh (= 50 % of the
                                 # usable window for this symmetric window)
  eta_charge: 0.9487             # sqrt(0.90) round trip
  eta_discharge: 0.9487
  degradation_cost_eur_per_mwh: 10.0
  converter_time_constant_s: 0.2

fcr_requirements:                # FCR technical requirements v1.1, Table 10 and section 3.5
  version: "1.1"
  power_factor_n: 1.34           # Table 10: full activation + NEM rate (1 + 0.34)
  power_factor_d_opposite: 0.20  # Table 10: FCR-D NEM power in the opposite direction
  energy_hours_n: 1.0
  energy_hours_d: 0.3333333333
  nem_rate_n: 0.34               # eq. 16, may be raised up to 0.50
  nem_rate_d: 0.20               # eq. 17, may be raised up to 0.34
  nem_window_s: 300              # eq. 15
  aem_window_s: 300              # eq. 18
  max_per_product_mw: 70.0
  thresholds_min:                # Table 11, minutes of full activation (C * t / E)
    fcr_n:
      aem_enable: 5.0
      aem_disable: 10.0
      nem_enable: 30.0
      nem_disable: 57.5
    fcr_d:
      aem_enable: 5.0
      aem_disable: 10.0
      nem_enable: 20.0
      nem_disable: 20.0          # equal to enable in v1.1: no hysteresis (PDF p. 40-41)

simulation:
  long_horizon_step_s: 1.0
  test_signal_step_s: 0.1
  week_start: "2025-03-03T00:00:00Z"   # pick a week inside the downloaded Fingrid month
  max_frequency_gap_s: 600       # longest frequency gap filled by linear interpolation

paths:
  raw: data/raw
  processed: data/processed
  sample: data/sample
  results: results
  figures: docs/figures
