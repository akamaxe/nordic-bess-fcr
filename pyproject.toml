[project]
name = "nordic-bess-fcr"
version = "1.0.0"
description = "Bidding, control and FCR prequalification tests for a battery in the Swedish SE3 zone."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "matplotlib",
    "pyomo",
    "highspy",
    "entsoe-py",
    "requests",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
fast = ["numba"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nordic_bess"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
